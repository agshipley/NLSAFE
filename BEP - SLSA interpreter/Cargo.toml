[package]
name = "bep-to-slsa"
version = "0.1.0"
edition = "2021"
authors = ["NLSAFE Team"]
description = "Transform Bazel BEP data to SLSA provenance format"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
structopt = "0.3"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
log = "0.4"
env_logger = "0.9"
